name: synful
# Reproduces the working environment (Python 3.7 / TensorFlow 1.14 / CUDA 10.0).
# cudatoolkit + cudnn come from conda so a system CUDA install is not required;
# an NVIDIA driver supporting CUDA 10.0 (>=410) is still needed on the host.
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.7
  - cudatoolkit=10.0
  - cudnn=7.6
  - pip
  - pip:
      - numpy==1.21.5
      - scipy==1.7.3
      # Install ONLY the GPU build. Also installing the CPU `tensorflow`
      # package shadows it, and the network then runs on CPU (fails: the
      # NCHW transposed-convs are GPU-only).
      - tensorflow-gpu==1.14.0
      - protobuf==3.20.3   # TF 1.14 is incompatible with protobuf 4.x
      - tqdm
      - requests
      - h5py==3.8.0
      - zarr==2.12.0
      - numcodecs==0.10.2
      - pymongo==4.7.3
      - scikit-image==0.19.3
      - scikit-learn==1.0.2
      - networkx==2.6.3
      - daisy==0.2.1
      - augment-nd==0.1.3
      - funlib.geometry==0.2
      - funlib.math==0.1
